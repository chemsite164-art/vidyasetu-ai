name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Organize Android project structure
        run: |
          mkdir -p app/src/main/assets app/src/main/java/com/vidyasetu/ai app/src/main/res/drawable app/src/main/res/values
          cp index.html app/src/main/assets/index.html
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp MainActivity.kt app/src/main/java/com/vidyasetu/ai/MainActivity.kt
          cp ic_launcher.xml app/src/main/res/drawable/ic_launcher.xml

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">VidyaSetu AI</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.VidyaSetu" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:statusBarColor">#1D4ED8</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.vidyasetu.ai"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.vidyasetu.ai"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.webkit:webkit:1.11.0")
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VidyaSetu-AI-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
